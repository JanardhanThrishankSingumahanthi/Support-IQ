services:
  - type: web
    name: supportiq
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      if command -v npm >/dev/null 2>&1; then
        cd frontend && npm install && npm run build && cd ..
      fi
      pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: ""
      # Set SUPPORTIQ_DATA_DIR if a persistent disk is mounted (e.g., on Render Starter+ plan):
      # - key: SUPPORTIQ_DATA_DIR
      #   value: /var/data
      - key: SUPPORTIQ_DATA_DIR
        value: ""
